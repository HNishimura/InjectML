[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "injectml"
version = "0.1.0"
description = "Knowledge injection for offline LLMs without training."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["injectml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
